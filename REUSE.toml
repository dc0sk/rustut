version = 1
SPDX-PackageName = "rustut"
SPDX-PackageSupplier = "Simon Keimer <simon.keimer@mailbox.org>"
SPDX-PackageDownloadLocation = "https://github.com/dc0sk/rustut"

[[annotations]]
path = "src/**"
SPDX-FileCopyrightText = "2026 Simon Keimer and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["examples/**", "exercises/**", "solutions/**"]
SPDX-FileCopyrightText = "2026 Simon Keimer and contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [
    "*.toml",
    ".gitignore",
    ".github/**",
    "AGENTS.md",
    "LICENSING.md",
    "README.md",
]
SPDX-FileCopyrightText = "2026 Simon Keimer and contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Cargo.lock is machine-generated and Cargo may rewrite it, stripping any
# inline header comment - so it needs an explicit REUSE.toml annotation
# rather than relying on the "*.toml" glob above (Cargo.lock isn't a
# .toml file) or an inline comment surviving a `cargo build`.
[[annotations]]
path = "Cargo.lock"
SPDX-FileCopyrightText = "2026 Simon Keimer and contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
