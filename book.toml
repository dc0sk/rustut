[book]
title = "Rust for C Engineers"
authors = ["Simon Keimer and contributors"]
description = "A deep, example-driven Rust tutorial for engineers who already think in C: ownership vs malloc/free, borrowing vs raw pointers, traits vs vtables, fearless concurrency vs pthreads, and how to build real PC applications idiomatically."
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/dc0sk/rustut"
edit-url-template = "https://github.com/dc0sk/rustut/edit/main/{path}"

[output.html.fold]
enable = true
level = 1

[output.linkcheck]
follow-web-links = false
# optional: neither CI nor a local `cargo install mdbook` installs the
# separate mdbook-linkcheck binary, so without this flag `mdbook build`
# hard-fails ("backend not installed") for everyone. With it, link
# checking simply runs if the binary happens to be present (`cargo
# install mdbook-linkcheck`) and is silently skipped otherwise.
optional = true
