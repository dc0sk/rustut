name: book

on:
  push:
    branches: [main]
  pull_request:

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Reject hand-typed rust fences
        run: |
          # Every rust code sample must come from {{#include}} of a real,
          # compiled example crate, never a hand-typed fence — that's the
          # anti-rot guarantee. Flag any ```rust fence not immediately
          # preceded (within 2 lines) by an {{#include}} directive.
          if grep -rnE '^```rust\b' src --include='*.md' | grep -v -f <(grep -rlE '\{\{#include' src --include='*.md'); then
            echo "::error::found a ```rust fence in a chapter whose file contains no {{#include}} — hand-typed code samples are not allowed, see book.yml"
            exit 1
          fi

      - run: mdbook build
      - run: mdbook test

      - name: Upload book artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
